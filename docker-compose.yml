services:
  arr-guard:
    image: meinya/arr-guard:latest
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: ${MODE:-serve}
      LISTEN_ADDR: ":8080"
      FFPROBE_PATH: "/usr/local/bin/ffprobe"
      UNMATCHED_PATH: "/var/lib/arr-guard/unmatched.json"
      STATE_PATH: "/var/lib/arr-guard/state.json"
      PATH_MAPPINGS_JSON: '[{"from":"/media","to":"/media"}]'
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media:ro
      - arr-guard-state:/var/lib/arr-guard

volumes:
  arr-guard-state:
