services:
  arr-subtitle-guard:
    build: .
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      SONARR_URL: "http://sonarr:8989"
      SONARR_API_KEY: "replace-me"
      RADARR_URL: "http://radarr:7878"
      RADARR_API_KEY: "replace-me"
      WEBHOOK_TOKEN: "replace-with-a-long-random-token"
      PATH_MAPPINGS_JSON: '[{"from":"/tv","to":"/media/tv"},{"from":"/movies","to":"/media/movies"}]'
      STATE_PATH: "/var/lib/arr-subtitle-guard/state.json"
      MAX_ATTEMPTS: "3"
      WORKERS: "2"
    ports:
      - "8080:8080"
    volumes:
      - /srv/media/tv:/media/tv:ro
      - /srv/media/movies:/media/movies:ro
      - arr-subtitle-guard-state:/var/lib/arr-subtitle-guard

volumes:
  arr-subtitle-guard-state:
